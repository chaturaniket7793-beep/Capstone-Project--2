version: '3.8'

services:
  frontend:
    build: ./FrontEnd
    ports:
      - "80:80"
    networks:
      - app-network

  backend:
    build: ./BackEnd
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - app-network

  redis:
    image: redis:alpine
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - app-network

volumes:
  redis-data:

networks:
  app-network:
    driver: bridge